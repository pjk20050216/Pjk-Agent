# DevFlow 本地 Elasticsearch（单节点 + IK 中文分词），供 RAG 混合检索使用。
#
# 用法：
#   cd docker
#   docker compose up -d --build      # 构建含 IK 的镜像并启动
#   docker compose logs -f            # 观察启动日志
#   docker compose down               # 停止（保留 es_data 卷中的数据）
#   docker compose down -v            # 停止并清空索引数据
#
# 后端 .env 对应配置：ES_URL=http://localhost:9200（无认证）
services:
  elasticsearch:
    build:
      context: ./elasticsearch
    image: devflow-elasticsearch:8.17.0-ik
    container_name: devflow-es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  es_data:
