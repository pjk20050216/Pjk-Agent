# 用于管理大语言模型的接入设置

llm:
  active_provider: 0 # 意味着系统默认使用列表中的第一个提供商，即“Qwen (DashScope)
  providers:
    - name: "Qwen (DashScope)"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key_env: "DASHSCOPE_API_KEY"
      default_model: "qwen-max"
      # 意图识别专用小模型（低延迟）；为空则回退 default_model
      # qwen-turbo 虽在模型列表中，但实测持续 429（账号无额度），改用 qwen-flash（实测 ~277ms）
      classifier_model: "qwen-flash"
      # 文本转向量模型
      embedding_model: "text-embedding-v3"
      # DashScope 兼容模式不接受「整数 token 数组」形式的 embedding 输入，
      # 故必须关闭 langchain 的 tiktoken 预分词（默认 false）。
      # 若改用 OpenAI 官方端点，可设为 true 以启用其分词优化。
      embedding_check_ctx_length: false
    - name: "OpenAI GPT-4o"
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
      default_model: "gpt-4o"
      classifier_model: "gpt-4o-mini"

      embedding_model: "text-embedding-3-small"
      # OpenAI 官方端点接受 token 数组，可启用其分词优化
      embedding_check_ctx_length: true
    - name: "Custom OpenAI-Compatible"
      base_url: "http://localhost:11434/v1"
      api_key_env: "CUSTOM_API_KEY"
      default_model: "llama3"
      classifier_model: "llama3"
      embedding_model: "nomic-embed-text"

# Redis 缓存配置
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  ttl:
    llm: 3600
    embedding: 3600
    rag: 1800
    tool: 3600
    route_static: 3600
    route_user: 30
    websearch: 900

# 网关配置
gateway:
  enabled: true

# 速率限制（网关中间件使用）
rate_limit:
  authenticated: "100/minute"
  unauthenticated: "30/minute"
  llm_concurrency: 5

# 熔断器（保护 LLM API 调用）
circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_timeout: 60

# RAG 防幻觉配置
rag:
  relevance_threshold: 0.45
  top_k: 6

# Elasticsearch 全文检索（与 Chroma 并行混合检索）
elasticsearch:
  enabled: true
  url: "http://localhost:9200"
  index: "devflow_documents"
  hybrid_enabled: true
  es_top_k: 6
  rrf_k: 60

# 联网搜索（博查 Bocha）
web_search:
  enabled: true
  base_url: "https://api.bochaai.com/v1/web-search"
  count: 5
  timeout: 15

# 意图识别（防注入）：正则过滤 + LLM 语义分类 + Prompt 护栏
intent_guard:
  enabled: true
  regex_enabled: true
  llm_enabled: true
  llm_timeout_ms: 1500
  # LLM 分类触发策略：always（每条消息）| first_turn_or_long（默认，仅首轮或长输入）| off
  llm_trigger: "first_turn_or_long"
  # first_turn_or_long 策略下，超过该字符数的输入也触发 LLM 分类
  llm_long_input_threshold: 200

# ============================================================================
# 风控策略智能运维多智能体系统
# 所有字段均可用 HARNESS_ 前缀的环境变量覆盖，例如 HARNESS_MAX_PARALLEL=8
# ============================================================================
harness:
  enabled: true
  # 关闭后强制走确定性回退（离线演示 / CI / 故障演练），不发起任何 LLM 请求
  llm_enabled: true
  # 运行时工作根目录：每个 run 一个子目录，虚拟文件系统落在其中
  workspace_root: "data/harness"
  # 技能目录（SKILL.md + 资源文件）
  skills_dir: "skills"
  # 子 Agent 并发上限（asyncio 信号量）
  max_parallel_subagents: 4
  # 单次运行最多拆解任务数
  max_tasks: 12
  # 单个 Agent 的工具调用最大轮次
  max_tool_iterations: 6
  # 运行超时（秒）
  run_timeout_seconds: 1800
  # 单文件写入上限（字节）
  vfs_max_file_bytes: 2000000

  context:
    # 主 Agent 上下文预算（token 估算值）
    budget_tokens: 24000
    # 子 Agent 回传摘要的最大字符数（控制主上下文污染）
    summary_max_chars: 1200
    # 注入模型的历史消息条数上限
    max_history_messages: 20

  memory:
    # 短期记忆（Redis）TTL：对话、任务计划、审批断点、临时数据
    short_term_ttl: 86400
    # 长期记忆（Milvus）检索条数
    long_term_top_k: 5
    # 任务结束后是否自动复盘沉淀经验
    distill_enabled: true
    # Milvus 不可用时的本地降级目录（JSONL）
    fallback_dir: "data/harness/memories"

  sandbox:
    enabled: true
    # opensandbox = 调用 OpenSandbox 服务；local = 本地受限子进程（自动回退）
    provider: "opensandbox"
    base_url: "http://127.0.0.1:8080"
    api_key: ""
    namespace: "default"
    image: "python:3.12-slim"
    # 单条命令超时（秒）与输出截断
    command_timeout: 60
    max_output_bytes: 65536
    # 沙箱默认禁止外网
    allow_network: false
    # 沙箱会话存活时间（秒）
    workspace_ttl: 3600
    # 允许执行的命令白名单（local provider 生效）
    allowed_commands: ["python", "python3", "pytest", "cat", "ls", "dir", "echo", "type", "findstr", "grep"]
    # 命中即拒绝的高危模式（网络下载 / 提权 / 破坏性删除 / 反弹 shell）
    denied_patterns:
      - "rm\\s+-rf\\s+/"
      - "curl\\s+.*\\|\\s*(ba)?sh"
      - "wget\\s+.*\\|\\s*(ba)?sh"
      - "nc\\s+-e"
      - "bash\\s+-i\\s+>&"
      - "mkfs"
      - "dd\\s+if="
      - "chmod\\s+777\\s+/"
      - "shutdown|reboot"
      - "powershell\\s+-enc"

  milvus:
    enabled: true
    uri: "http://localhost:19530"
    token: ""
    collection: "harness_memories"
    # 向量维度需与 embedding 模型一致（text-embedding-v3 默认 1024）
    dim: 1024
    top_k: 5

  kafka:
    enabled: true
    bootstrap_servers: "localhost:9092"
    topic_audit: "harness.audit"
    topic_trace: "harness.trace"
    client_id: "harness-runtime"
    # Kafka 不可用时的本地落盘缓冲（公司链路追踪平台的兜底）
    buffer_dir: "data/harness/audit"

  approvals:
    enabled: true
    # 审批超时（秒），超时自动拒绝
    ttl_seconds: 1800
    # 低风险动作自动放行（仅限明确列出的动作）
    auto_approve_actions: []
    # 必须人工审批的动作
    required_actions:
      - "rule.publish"
      - "rule.gray_release"
      - "sandbox.exec"
      - "file.promote"
      - "policy.write"
      - "java.tool.invoke"

  tracing:
    enabled: true
    jsonl_dir: "data/traces"
    sample_rate: 1.0
    # 内存中保留的最大事件数（供 API 查询）
    max_events: 5000

  java_bridge:
    enabled: false
    base_url: "http://127.0.0.1:8081"
    # 与 Java 侧共享的 HMAC 密钥，用于内部接口互信
    shared_secret: ""
    timeout: 10
    manifest_path: "/internal/harness/tools"

  # 外部数据采集（web_search 复用博查；web_fetch 抓取网页正文）
  web:
    enabled: true
    fetch_enabled: true
    timeout: 20
    max_bytes: 2000000
    max_chars: 12000
    max_redirects: 3
    # 为空表示允许公网；SSRF 防护始终拒绝回环/私网/链路本地地址
    allowed_domains: []
    blocked_domains: ["localhost", "127.0.0.1", "0.0.0.0", "::1"]
    allowed_ports: [80, 443]
    user_agent: "AgentHarness/1.0 (+risk-strategy-ops)"
    cache_ttl: 900
    max_sources: 8
    # 搜索不可用且未给 URL 时回退到内部规则库
    offline_fallback: true
